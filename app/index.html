<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:shield-check.svg?color=%2300E676" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGY RAG Studio K3 — Phạm Quốc Thanh (2A202601407) & Thành An (01017)</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                accent: '#00E676',
                deep: '#00C853',
                mint: '#1DE9B6',
                glow: '#00E5FF'
              },
              dark: {
                bg: '#0D0F12',
                surface: '#161B22',
                active: '#1F262E'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
    <!-- FontAwesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #0D0F12;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        background-image: 
          radial-gradient(circle at top, rgba(0, 230, 118, 0.18) 0%, rgba(13, 15, 18, 0) 65%),
          radial-gradient(circle at 85% 85%, rgba(0, 229, 255, 0.08) 0%, transparent 40%);
        background-attachment: fixed;
      }

      /* Glassmorphism Surface Tokens (styling.md) */
      .glass-card-dark, .glass-panel {
        background: rgba(22, 27, 34, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      }

      .glass-card-light {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      /* Emerald Ambient Glow Shadow & Gradient Mesh */
      .shadow-emerald-glow {
        box-shadow: 0px 10px 30px -5px rgba(0, 230, 118, 0.35);
      }

      .shadow-soft {
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.06);
      }

      .hero-green-glow {
        background: linear-gradient(135deg, #0A3A2A 0%, #00C853 50%, #00E5FF 100%);
      }

      .banner-gradient {
        background: linear-gradient(110deg, #022C22 0%, #056852 40%, #00E676 100%);
      }

      .emerald-accent-text {
        background: linear-gradient(135deg, #00E676 0%, #1DE9B6 50%, #00E5FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Custom Token Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(13, 15, 18, 0.9);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 230, 118, 0.35);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 230, 118, 0.7);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-100 antialiased selection:bg-[#00E676] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
